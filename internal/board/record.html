<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record sheets</title>
<style>
  :root { --text: #1c2026; --soft: #5d6570; --edge: #cdd3da; --card: #ffffff; --ground: #edf0f3;
          --go: #0b5cad; --stop: #a1361b; --faint: #e3e8ee; }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--ground); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .frame { max-width: 1040px; margin: 0 auto; padding: 14px 16px 40px; }
  .pick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .pick h1 { margin: 0; font-size: 1.15rem; min-width: 8.5em; text-align: center; }
  .saves { color: var(--soft); margin-left: auto; }
  .plan { margin: 10px 0 12px; }
  .statement { font-size: 1.2rem; margin: 0 0 4px; }
  .about { color: var(--soft); margin: 0 0 6px; }
  .write { margin: 0; padding-left: 1.6em; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
  .write .tag { font-family: system-ui, sans-serif; font-size: 0.8rem; color: var(--go); margin-left: 0.6em; }
  .paper { position: relative; }
  #sheet { display: block; width: 100%; height: auto; background: #fff; border: 1px solid var(--edge);
           border-radius: 6px; touch-action: none; cursor: crosshair; }
  #sheet.rubbing { cursor: cell; }
  /* The bands of the lines, or the frames of the parts, lie over the drawing surface, inside the sheet's 1px border, and let the pen through. */
  #bands { position: absolute; inset: 1px; width: calc(100% - 2px); height: calc(100% - 2px);
           border-radius: 5px; pointer-events: none; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  button { font: inherit; padding: 5px 14px; border-radius: 6px; border: 1px solid var(--edge);
           background: var(--card); color: var(--text); cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.go { background: var(--go); border-color: var(--go); color: #fff; }
  button[aria-pressed="true"] { background: var(--faint); border-color: var(--text); font-weight: 600; }
  #status { color: var(--soft); }
  .markup { margin-top: 16px; background: var(--card); border: 1px solid var(--edge); border-radius: 8px; padding: 12px 16px; }
  .markup fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  .markup legend { font-weight: 600; font-size: 1.05rem; padding: 0; margin-bottom: 8px; }
  .lines { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
  .line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .line input[type="text"] { font: inherit; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
                             flex: 1 1 16em; min-width: 0; padding: 3px 6px; }
  .fields { display: grid; grid-template-columns: max-content minmax(0, 22em) auto; gap: 6px 10px; align-items: center; }
  .fields select { font: inherit; }
  .flag { color: var(--stop); font-size: 0.9rem; }
  .sub { font-weight: 600; margin: 14px 0 4px; }
  .erasure-list { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 4px; }
  .erasure-list label { display: inline-flex; align-items: center; gap: 6px; }
  .kind { color: var(--soft); margin: 0; }
  .edit { margin: 0 0 10px; padding: 8px 10px; background: var(--ground); border-radius: 6px; }
  .edit .bar { margin-top: 6px; }
  .line label { display: inline-flex; align-items: center; gap: 4px; }
  .notes { margin: 10px 0 0; padding-left: 1.2em; }
  .notes.problems { color: var(--stop); }
</style>
</head>
<body>
<div class="frame">
  <nav class="pick" aria-label="The sheets of the plan">
    <button id="sheet-prev" type="button" aria-label="Previous sheet">←</button>
    <h1 id="title">Sheet</h1>
    <button id="sheet-next" type="button" aria-label="Next sheet">→</button>
    <span id="saves" class="saves"></span>
  </nav>
  <section class="plan" aria-labelledby="title">
    <p id="statement" class="statement" lang="ru"></p>
    <p id="about" class="about"></p>
    <ol id="write" class="write"></ol>
  </section>
  <div class="paper">
    <canvas id="sheet" width="1000" height="600" aria-label="The sheet to write the plan on"></canvas>
    <canvas id="bands" width="1000" height="600"></canvas>
  </div>
  <div class="bar">
    <button id="eraser" type="button" aria-pressed="false">Eraser</button>
    <button id="undo" type="button">Undo</button>
    <button id="clear" type="button">Clear</button>
    <button id="done" type="button" class="go">Done</button>
    <span id="status" role="status"></span>
  </div>
  <section id="markup" class="markup" hidden aria-label="The markup of the sheet">
    <fieldset id="fields">
      <legend>The markup, filled in from the plan</legend>
      <div class="edit">
        <p id="picked" class="kind"></p>
        <div class="bar">
          <label for="move-to">Move them to</label>
          <select id="move-to"></select>
          <button id="move" type="button">Move</button>
          <button id="loose" type="button">Not a line</button>
          <button id="unpick" type="button">Unpick</button>
        </div>
        <p id="edit-note" class="kind"></p>
        <p id="loose-note" class="kind"></p>
      </div>
      <ol id="lines" class="lines"></ol>
      <div class="fields">
        <label for="outcome">Outcome</label>
        <select id="outcome" aria-describedby="flag-outcome">
          <option value="correct">correct</option>
          <option value="error">error</option>
          <option value="unreadable">unreadable</option>
        </select>
        <span id="flag-outcome" class="flag"></span>
        <label for="first-error" id="first-error-label">First wrong line</label>
        <select id="first-error" aria-describedby="flag-first-error"></select>
        <span id="flag-first-error" class="flag"></span>
        <label for="trap">Trap</label>
        <select id="trap" aria-describedby="flag-trap"></select>
        <span id="flag-trap" class="flag"></span>
      </div>
      <div id="erasure-block" hidden>
        <p id="erasures-title" class="sub">Erasures</p>
        <ol id="erasures" class="erasure-list" aria-labelledby="erasures-title"></ol>
        <span id="flag-erasures" class="flag"></span>
        <div id="planned-fields" class="fields" hidden>
          <label for="planned-line" id="planned-line-label">Line written in its place</label>
          <select id="planned-line" aria-describedby="flag-planned-line"></select>
          <span id="flag-planned-line" class="flag"></span>
          <label for="planned-text">What the erased strokes said</label>
          <input id="planned-text" type="text" spellcheck="false" aria-describedby="flag-planned-text">
          <span id="flag-planned-text" class="flag"></span>
        </div>
        <p id="planned-kind" class="kind"></p>
      </div>
    </fieldset>
    <ul id="differences" class="notes"></ul>
    <ul id="problems" class="notes problems"></ul>
    <div class="bar">
      <button id="back" type="button">Back</button>
      <button id="save" type="button" class="go">Save</button>
    </div>
  </section>
</div>
<script>
"use strict";
// The record page: the author writes a sheet of the sheet plan, the board finds its lines, and the
// author checks the markup the plan fills in and saves the sheet as a sample of the format
// tutor-sample v0 (R25). Every point keeps its time and its pressure. The eraser and Undo take
// whole strokes away, and each time they do is an erasure with its time. On a sheet of a plan of
// parts the board finds its parts instead, by the groups of strokes of the eval protocol, and the
// page frames them and keeps them in the order of first writing (T61).
const WIDTH = 1000;
const HEIGHT = 600;
const REACH = 6;        // how near, in units of the sheet, the eraser's path passes a stroke it takes
const AGAIN_MS = 4000;  // how long a press that would lose the sheet waits for the second one
const TYPE_MS = 300;    // how long typing in a text of the form pauses before the board checks it
const PICK = 10;        // how near, in units of the sheet, a click picks a stroke after Done
const DRAG = 4;         // how far, in units of the sheet, the pointer goes before a click is a rectangle
const FRAME = 6;        // how far, in units of the sheet, the frame of a part stands off its strokes
const KINDS = { mistake: "a mistake, fixed after it", "correct-step": "a correct step, replaced by a wrong one" };
const PLACES = { left: "main column", right: "at the side", wide: "across the sheet" };

const byId = (id) => document.getElementById(id);
const sheetCanvas = byId("sheet");
const ink = sheetCanvas.getContext("2d");
const bandCanvas = byId("bands");
const shade = bandCanvas.getContext("2d");
Object.assign(ink, { lineWidth: 3, lineCap: "round", lineJoin: "round" });

// view is the page; sheet is what is written on the sheet being recorded. mode is "write", then
// "markup" after Done, and "saved" once the server has saved the sheet.
const view = { plan: null, at: 0, mode: "write", tool: "pen", hold: null, pending: null,
               proposal: null, planned: -1, pausedAt: 0, saved: false, busy: false,
               lines: [], loose: [], picked: new Set(), drag: null, checks: 0, checked: null, regrouped: false, typing: 0 };
let sheet = blank(0);

// blank is a new sheet, whose clock starts at the time stamp start: every time on it — of a point
// or an erasure — is milliseconds since then, and never less than the time before it.
function blank(start) {
  return { strokes: [], erasures: [], start, last: 0, made: 0, boxes: new Map() };
}

// clock gives the time on the sheet of a moment, given as an event's time stamp or performance.now():
// both count from the same time origin.
function clock(stamp) {
  sheet.last = Math.max(sheet.last, Math.round(stamp - sheet.start));
  return sheet.last;
}

function make(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text; // the plan's words are text, never markup
  if (className) node.className = className;
  return node;
}

function say(text) { byId("status").textContent = text; }
function current() { return view.plan.sheets[view.at]; }
// ofParts says whether the sheet shown is of a plan of parts, unit names what its markup is made of,
// and mendHint says how to mend markup whose count is not the plan's.
function ofParts() { return (current().parts ?? []).length > 0; }
function unit() { return ofParts() ? "part" : "line"; }
function Unit() { return ofParts() ? "Part" : "Line"; }
function mendHint() {
  return ` Pick strokes on the sheet, with a click or a rectangle, and move them, or join ${unit()}s, until they are the plan’s; or press Back to take a stray stroke away or write what is missing, or Clear to write the sheet again.`;
}
function within(value, low, high) { return Math.min(Math.max(value, low), high); }
function rounded(value, scale) { return Math.round(value * scale) / scale; }
function unsaved() { return sheet.strokes.length > 0 && !view.saved; }
function erasedIds() { return new Set(sheet.erasures.flatMap((e) => e.strokes)); }
function visible() {
  const gone = erasedIds();
  return sheet.strokes.filter((s) => !gone.has(s.id));
}

// surface is where the sheet's drawing surface stands on the screen: the canvas's content box, inside
// its border, over which the sheet's units stretch.
function surface() {
  const r = sheetCanvas.getBoundingClientRect();
  return { left: r.left + sheetCanvas.clientLeft, top: r.top + sheetCanvas.clientTop,
           width: sheetCanvas.clientWidth, height: sheetCanvas.clientHeight };
}

// spot is where an event falls on the sheet, in its units, kept on the sheet.
function spot(e, box) {
  return {
    x: rounded(within((e.clientX - box.left) * WIDTH / box.width, 0, WIDTH), 10),
    y: rounded(within((e.clientY - box.top) * HEIGHT / box.height, 0, HEIGHT), 10),
  };
}

// point is a sample of the pen: its place, its time on the sheet and its pressure. A device without
// pressure, a mouse, reports 0.5 while its button is down (Pointer Events).
function point(e, box) {
  const pressure = Number.isFinite(e.pressure) ? within(e.pressure, 0, 1) : 0.5;
  return { ...spot(e, box), t_ms: clock(e.timeStamp), pressure: rounded(pressure, 1000) };
}

// samples are the pen's moves an event stands for: the events the browser coalesced into it, or the
// event itself where it gives none.
function samples(e) {
  const coalesced = typeof e.getCoalescedEvents === "function" ? e.getCoalescedEvents() : [];
  return coalesced.length > 0 ? coalesced : [e];
}

// eraserEnd tells the back end of a pen, its eraser button, from its tip.
function eraserEnd(e) {
  return e.pointerType === "pen" && (e.button === 5 || (e.buttons & 32) === 32);
}

function gap(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const along = dx === 0 && dy === 0 ? 0 : within(((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy), 0, 1);
  return Math.hypot(p.x - (a.x + along * dx), p.y - (a.y + along * dy));
}

function touches(stroke, p) {
  return stroke.points.some((a, i) => gap(p, a, stroke.points[i + 1] ?? a) <= REACH);
}

// boxOf is the box a finished stroke takes on the sheet, kept once it is first asked for.
function boxOf(stroke) {
  let box = sheet.boxes.get(stroke.id);
  if (!box) {
    const xs = stroke.points.map((p) => p.x), ys = stroke.points.map((p) => p.y);
    box = { left: Math.min(...xs), right: Math.max(...xs), top: Math.min(...ys), bottom: Math.max(...ys) };
    sheet.boxes.set(stroke.id, box);
  }
  return box;
}

// sweep marks the strokes still on the sheet that the eraser touches on its path from a to b. It
// tests the path in steps short enough to miss no stroke, and only the strokes whose box the path
// comes within reach of.
function sweep(hold, a, b) {
  const near = visible().filter((st) => {
    const box = boxOf(st);
    return !hold.touched.has(st.id) && Math.min(a.x, b.x) - REACH <= box.right && Math.max(a.x, b.x) + REACH >= box.left &&
      Math.min(a.y, b.y) - REACH <= box.bottom && Math.max(a.y, b.y) + REACH >= box.top;
  });
  if (near.length === 0) return;
  const steps = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / (REACH / 2)));
  for (let k = 1; k <= steps; k++) {
    const p = { x: a.x + (b.x - a.x) * k / steps, y: a.y + (b.y - a.y) * k / steps };
    for (const st of near) if (!hold.touched.has(st.id) && touches(st, p)) hold.touched.add(st.id);
  }
}

function trace(ctx, points) {
  const [first, ...rest] = points;
  ctx.beginPath();
  ctx.moveTo(first.x, first.y);
  for (const p of rest) ctx.lineTo(p.x, p.y);
  if (rest.length === 0) ctx.lineTo(first.x + 0.01, first.y); // a dot still shows
  ctx.stroke();
}

// draw shows the strokes still on the sheet, in the look of the check board; those the eraser is
// touching right now are pale. While the pen writes, only its new pieces of line are drawn.
function draw() {
  ink.fillStyle = "#fff";
  ink.fillRect(0, 0, WIDTH, HEIGHT);
  const touched = view.hold?.rubbing ? view.hold.touched : new Set();
  for (const s of visible()) {
    ink.strokeStyle = touched.has(s.id) ? "#b9c0c8" : "#111";
    trace(ink, s.points);
  }
}

function piece(a, b) {
  ink.strokeStyle = "#111";
  ink.beginPath();
  ink.moveTo(a.x, a.y);
  ink.lineTo(b.x, b.y);
  ink.stroke();
}

function drawBands(bands) {
  shade.clearRect(0, 0, WIDTH, HEIGHT);
  shade.font = "600 20px system-ui, sans-serif";
  shade.textAlign = "right";
  shade.textBaseline = "middle";
  for (const [i, b] of bands.entries()) {
    if (!b) continue;
    shade.fillStyle = i % 2 === 0 ? "rgba(11, 92, 173, 0.12)" : "rgba(214, 122, 18, 0.15)";
    shade.fillRect(0, b.top - 6, WIDTH, b.bottom - b.top + 12);
    shade.fillStyle = "#0b3d75";
    shade.fillText(String(i + 1), WIDTH - 10, (b.top + b.bottom) / 2);
  }
}

// boxOfAll is the box the points of strokes take, in units of the sheet, or null when they have
// none.
function boxOfAll(ids) {
  const want = new Set(ids);
  let box = null;
  for (const st of sheet.strokes) {
    if (!want.has(st.id) || st.points.length === 0) continue;
    const b = boxOf(st);
    box = box ? { left: Math.min(box.left, b.left), right: Math.max(box.right, b.right), top: Math.min(box.top, b.top), bottom: Math.max(box.bottom, b.bottom) } : { ...b };
  }
  return box;
}

// drawFrames frames each part of the form, with its number in the frame's corner.
function drawFrames(boxes) {
  shade.clearRect(0, 0, WIDTH, HEIGHT);
  shade.font = "600 18px system-ui, sans-serif";
  shade.textAlign = "left";
  shade.textBaseline = "top";
  shade.lineWidth = 2;
  for (const [i, b] of boxes.entries()) {
    if (!b) continue;
    const x = b.left - FRAME, y = b.top - FRAME, w = b.right - b.left + 2 * FRAME, h = b.bottom - b.top + 2 * FRAME;
    shade.fillStyle = i % 2 === 0 ? "rgba(11, 92, 173, 0.08)" : "rgba(214, 122, 18, 0.10)";
    shade.fillRect(x, y, w, h);
    shade.strokeStyle = i % 2 === 0 ? "rgba(11, 92, 173, 0.8)" : "rgba(214, 122, 18, 0.9)";
    shade.strokeRect(x, y, w, h);
    shade.fillStyle = "#0b3d75";
    shade.fillText(String(i + 1), x + 3, y + 2);
  }
}

// drawDrag shows the rectangle the pointer is dragging to pick strokes with.
function drawDrag() {
  const d = view.drag;
  if (!d?.to) return;
  Object.assign(shade, { strokeStyle: "#7048e8", lineWidth: 1.5 });
  shade.setLineDash([6, 4]);
  shade.strokeRect(Math.min(d.from.x, d.to.x), Math.min(d.from.y, d.to.y), Math.abs(d.to.x - d.from.x), Math.abs(d.to.y - d.from.y));
  shade.setLineDash([]);
}

// drawErased shows the strokes the erasure taken for the planned one took away, over the sheet.
function drawErased() {
  const e = sheet.erasures[view.planned];
  if (!e) return;
  Object.assign(shade, { strokeStyle: "rgba(193, 18, 31, 0.7)", lineWidth: 3, lineCap: "round", lineJoin: "round" });
  for (const st of sheet.strokes.filter((x) => e.strokes.includes(x.id))) trace(shade, st.points);
}

// drawStrokes draws strokes still on the sheet over it, in a colour of their own.
function drawStrokes(ids, style, dash) {
  const want = new Set(ids);
  Object.assign(shade, { strokeStyle: style, lineWidth: 4, lineCap: "round", lineJoin: "round" });
  shade.setLineDash(dash);
  for (const st of visible()) if (want.has(st.id)) trace(shade, st.points);
  shade.setLineDash([]);
}

function overlay() {
  if (ofParts()) drawFrames(view.lines.map((l) => boxOfAll(l.strokes)));
  else drawBands(lineBands());
  drawStrokes(view.loose, "#7a828c", [6, 5]);
  drawStrokes([...view.picked], "#7048e8", []);
  drawErased();
  drawDrag();
}

function savesText(n) {
  if (n === 0) return "not saved yet";
  return n === 1 ? "saved once" : `saved ${n} times`;
}

// about says what the sheet is written for: its scenario, its answer, its planned mistake and the
// erasure it plans. In a drawing, the erased is drawn rather than written.
function about(sh) {
  const parts = [`Scenario ${sh.scenario}`, `the answer is ${unit()} ${sh.answer}`];
  if (sh.expected.outcome === "error") parts.push(`${unit()} ${sh.expected.first_error} is wrong on purpose`);
  if (sh.expected.trap) parts.push(`trap ${sh.expected.trap}`);
  let text = parts.join(" · ") + ".";
  const e = sh.erasure;
  if (e) {
    const verb = sh.parts?.[e.line - 1]?.kind === "drawing" ? "draw" : "write";
    text += ` On ${unit()} ${e.line}, ${verb} “${e.text}”, take it away in one stroke of the eraser, and ${verb} “${e.replacement}” instead.`;
  }
  return text;
}

// partTags names a part's kind and place, for the list of what to write.
function partTags(p) {
  const tags = [];
  if (p.kind === "drawing") tags.push("drawing");
  if (p.figure?.column) tags.push("in a column");
  tags.push(PLACES[p.place] ?? p.place);
  return tags;
}

function setControls() {
  const writing = view.plan !== null && view.mode === "write" && !view.busy;
  const sh = view.plan ? current() : null;
  byId("eraser").disabled = !writing;
  byId("undo").disabled = !writing || visible().length === 0;
  byId("done").disabled = !writing || visible().length === 0;
  for (const id of ["clear", "sheet-prev", "sheet-next"]) byId(id).disabled = view.busy || !sh;
  byId("fields").disabled = view.mode !== "markup" || view.busy;
  byId("back").disabled = view.mode !== "markup" || view.busy;
  byId("save").disabled = view.mode !== "markup" || view.busy || !ready();
  const editing = view.mode === "markup" && !view.busy && view.picked.size > 0;
  for (const id of ["move-to", "move", "loose", "unpick"]) byId(id).disabled = !editing;
  sheetCanvas.classList.toggle("rubbing", view.tool === "eraser");
}

// open starts the shown plan sheet anew: nothing written, its clock starting at stamp.
function open(stamp) {
  sheet = blank(stamp);
  Object.assign(view, { mode: "write", hold: null, pending: null, proposal: null, planned: -1, saved: false,
                        lines: [], loose: [], picked: new Set(), drag: null, checked: null });
  view.checks += 1;
  const sh = current();
  byId("title").textContent = `Sheet ${sh.number} of ${view.plan.sheets.length}`;
  byId("saves").textContent = savesText(sh.saved);
  byId("statement").textContent = sh.statement;
  byId("about").textContent = about(sh);
  byId("write").replaceChildren(...sh.lines.map((text, i) => {
    const item = make("li", text);
    if (ofParts()) item.append(...partTags(sh.parts[i]).map((t) => make("span", t, "tag")));
    if (i + 1 === sh.answer) item.append(make("span", "the answer", "tag"));
    if (sh.expected.first_error === i + 1) item.append(make("span", "wrong on purpose", "tag"));
    return item;
  }));
  byId("first-error-label").textContent = `First wrong ${unit()}`;
  byId("planned-line-label").textContent = `${Unit()} written in its place`;
  byId("loose").textContent = `Not a ${unit()}`;
  byId("markup").hidden = true;
  shade.clearRect(0, 0, WIDTH, HEIGHT);
  draw();
  setControls();
  say("");
}

// again lets a press that would lose what is written through only when it comes a second time, soon
// after the first; the first says so.
function again(what, e, message) {
  const p = view.pending;
  if (p && p.what === what && e.timeStamp - p.at <= AGAIN_MS) {
    view.pending = null;
    return true;
  }
  view.pending = { what, at: e.timeStamp };
  say(message);
  return false;
}

sheetCanvas.addEventListener("pointerdown", (e) => {
  if (view.plan && view.mode === "markup" && !view.busy && e.isPrimary) {
    if (e.pointerType !== "mouse" || e.button === 0) {
      // A press starts a pick anew: a drag whose release fell outside the sheet is dropped.
      e.preventDefault();
      sheetCanvas.setPointerCapture?.(e.pointerId);
      view.drag = { pointer: e.pointerId, from: spot(e, surface()), to: null };
    }
    return;
  }
  if (!view.plan || view.mode !== "write" || view.busy || view.hold || !e.isPrimary) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  e.preventDefault();
  sheetCanvas.setPointerCapture?.(e.pointerId);
  const box = surface();
  view.pending = null;
  if (view.tool === "eraser" || eraserEnd(e)) {
    const at = spot(e, box);
    view.hold = { pointer: e.pointerId, rubbing: true, touched: new Set(), at };
    sweep(view.hold, at, at);
  } else {
    sheet.made += 1;
    const stroke = { id: "s-" + String(sheet.made).padStart(4, "0"), points: [point(e, box)] };
    sheet.strokes.push(stroke);
    view.hold = { pointer: e.pointerId, rubbing: false, stroke };
  }
  draw();
});

sheetCanvas.addEventListener("pointermove", (e) => {
  if (dragTo(e)) return;
  const hold = view.hold;
  if (!hold || e.pointerId !== hold.pointer) return;
  const box = surface();
  const touched = hold.rubbing ? hold.touched.size : 0;
  for (const move of samples(e)) {
    if (hold.rubbing) {
      const p = spot(move, box);
      sweep(hold, hold.at, p);
      hold.at = p;
    } else {
      const p = point(move, box);
      piece(hold.stroke.points.at(-1), p);
      hold.stroke.points.push(p);
    }
  }
  if (hold.rubbing && hold.touched.size !== touched) draw();
});

// end lets the pointer go. The pen's stroke ends without a point: a pointerup has no pressure. A
// lifted eraser takes what it touched in that one move away, as one erasure at that moment; an
// eraser the browser cancelled, or whose capture it lost, takes nothing away.
function end(e, lifted) {
  if (dragEnd(e, lifted)) return;
  const hold = view.hold;
  if (!hold || e.pointerId !== hold.pointer) return;
  view.hold = null;
  if (hold.rubbing && hold.touched.size > 0) {
    if (lifted) {
      const taken = sheet.strokes.filter((s) => hold.touched.has(s.id)).map((s) => s.id);
      sheet.erasures.push({ t_ms: clock(e.timeStamp), strokes: taken });
    } else {
      say("The eraser was interrupted, and it took nothing away.");
    }
  }
  draw();
  setControls();
}
sheetCanvas.addEventListener("pointerup", (e) => end(e, true));
sheetCanvas.addEventListener("pointercancel", (e) => end(e, false));
sheetCanvas.addEventListener("lostpointercapture", (e) => end(e, false));

byId("eraser").addEventListener("click", () => {
  view.tool = view.tool === "eraser" ? "pen" : "eraser";
  byId("eraser").setAttribute("aria-pressed", String(view.tool === "eraser"));
  setControls();
});

// Undo takes the last stroke still on the sheet away, and the record keeps that as an erasure: a
// slip of the pen.
byId("undo").addEventListener("click", (e) => {
  if (view.mode !== "write" || view.hold) return;
  const last = visible().at(-1);
  if (!last) return;
  view.pending = null;
  sheet.erasures.push({ t_ms: clock(e.timeStamp), strokes: [last.id], undo: true });
  draw();
  setControls();
});

byId("clear").addEventListener("click", (e) => {
  if (!view.plan || view.hold || view.busy) return;
  if (unsaved() && !again("clear", e, "Press Clear again to start the sheet over.")) return;
  open(e.timeStamp);
});

function step(by, what, arrow, e) {
  if (!view.plan || view.hold || view.busy) return;
  if (unsaved() && !again(what, e, `The sheet is not saved: press ${arrow} again to leave it.`)) return;
  const n = view.plan.sheets.length;
  view.at = (view.at + by + n) % n;
  open(e.timeStamp);
}
byId("sheet-prev").addEventListener("click", (e) => step(-1, "prev", "←", e));
byId("sheet-next").addEventListener("click", (e) => step(1, "next", "→", e));

async function post(url, body) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  return { ok: res.ok, status: res.status, data };
}

const asErasure = (e) => ({ t_ms: e.t_ms, strokes: e.strokes, planned: null });

// Done locks the sheet and asks the board for its lines; the time until Back is cut out of the
// record, so the markup leaves no pause in it.
byId("done").addEventListener("click", async (e) => {
  if (!view.plan || view.mode !== "write" || view.hold || view.busy) return;
  const sh = current();
  if (visible().length === 0) return;
  const asked = sheet;
  Object.assign(view, { mode: "markup", pausedAt: e.timeStamp, pending: null, busy: true });
  setControls();
  say(`Finding the ${unit()}s…`);
  let answer;
  try {
    answer = await post("/api/record/propose", { number: sh.number, strokes: sheet.strokes, erasures: sheet.erasures.map(asErasure),
      undone: sheet.erasures.map((x) => Boolean(x.undo)) });
  } catch (err) {
    answer = { ok: false, data: { error: err.message } };
  }
  view.busy = false;
  if (sheet !== asked || view.mode !== "markup") return; // the author moved on meanwhile
  if (!answer.ok) {
    resume(performance.now());
    say(`The ${unit()}s are not found: ${answer.data.error || answer.status}.`);
    return;
  }
  view.proposal = answer.data;
  showMarkup();
});

// resume goes back to writing; the sheet's clock moves on by the time spent on the markup.
function resume(stamp) {
  sheet.start += stamp - view.pausedAt;
  Object.assign(view, { mode: "write", proposal: null, checked: null, picked: new Set(), drag: null });
  view.checks += 1;
  byId("markup").hidden = true;
  shade.clearRect(0, 0, WIDTH, HEIGHT);
  draw();
  setControls();
}

byId("back").addEventListener("click", (e) => {
  if (view.mode !== "markup" || view.busy) return;
  resume(e.timeStamp);
  say("");
});

function option(value, text) {
  const node = make("option", text);
  node.value = value;
  return node;
}

// bandOf is the band of the sheet that strokes take, from their highest point down to their
// lowest, or null when they have no points: lines.Band on the server.
function bandOf(ids) {
  const want = new Set(ids);
  let band = null;
  for (const st of sheet.strokes) {
    if (!want.has(st.id)) continue;
    for (const p of st.points) {
      band = band ? { top: Math.min(band.top, p.y), bottom: Math.max(band.bottom, p.y) } : { top: p.y, bottom: p.y };
    }
  }
  return band;
}

function lineBands() { return view.lines.map((l) => bandOf(l.strokes)); }

// fromPlan is a line of the form at its place: its strokes, and the text and the answer of the plan
// sheet's line there.
function fromPlan(strokes, i) {
  const sh = current();
  return { strokes, text: sh.lines[i] ?? "", answer: i + 1 === sh.answer, illegible: false, crossed_out: false,
           touched: false, textSet: false, answerSet: false };
}

function tick(name, checked, change) {
  const label = make("label");
  const box = make("input");
  Object.assign(box, { type: "checkbox", checked });
  box.addEventListener("change", () => {
    change(box.checked);
    edited();
  });
  label.append(box, ` ${name}`);
  return label;
}

function lineRow(line, i) {
  const row = make("li", undefined, "line");
  const name = make("label", `${Unit()} ${i + 1}`);
  name.htmlFor = `text-${i}`;
  const text = make("input");
  Object.assign(text, { type: "text", id: `text-${i}`, value: line.text, spellcheck: false });
  text.setAttribute("aria-describedby", `flag-line-${i}`);
  text.addEventListener("input", () => {
    Object.assign(line, { text: text.value, textSet: true });
    edited(true);
  });
  const pick = make("label");
  const radio = make("input");
  Object.assign(radio, { type: "radio", name: "answer", id: `answer-${i}`, checked: line.answer });
  radio.addEventListener("change", () => {
    for (const l of view.lines) Object.assign(l, { answer: l === line, answerSet: l === line });
    edited();
  });
  pick.append(radio, " the answer");
  row.append(name, text, pick,
    tick("illegible", line.illegible, (on) => { line.illegible = on; }),
    tick("crossed out", line.crossed_out, (on) => { line.crossed_out = on; }));
  if (i + 1 < view.lines.length) {
    const join = make("button", `Join with the next ${unit()}`);
    join.type = "button";
    join.addEventListener("click", () => joinNext(i));
    row.append(join);
  }
  const flag = make("span", "", "flag");
  flag.id = `flag-line-${i}`;
  row.append(flag);
  return row;
}

function onLine(n) {
  if (n === undefined) return `its ${unit()} being found`;
  return n ? `on ${unit()} ${n}` : `on no ${unit()}`;
}

// erasureRow is an erasure of the sheet in the form: a slip, or, on a sheet that plans an erasure,
// one the author may take for the planned one.
function erasureRow(e, i, on) {
  const row = make("li");
  const taken = `Erasure ${i + 1}: ${e.strokes.length === 1 ? "1 stroke" : e.strokes.length + " strokes"}, ${onLine(on[i])}`;
  if (e.undo) {
    row.textContent = `${taken}, by Undo: a slip.`;
    return row;
  }
  if (!current().erasure) {
    row.textContent = `${taken}, a slip.`;
    return row;
  }
  const label = make("label");
  const radio = make("input");
  Object.assign(radio, { type: "radio", name: "planned", id: `planned-${i}`, checked: i === view.planned });
  radio.addEventListener("change", () => {
    view.planned = i;
    overlay();
    edited();
  });
  label.append(radio, ` ${taken}`);
  row.append(label);
  return row;
}

function showErasures() {
  const sh = current();
  byId("erasure-block").hidden = sheet.erasures.length === 0 && !sh.erasure;
  byId("erasures-title").textContent = sh.erasure
    ? "Erasures: pick the planned one, and the rest are slips"
    : "Erasures, all of them slips";
  // The board names each erasure's line in its check of the markup as it stands.
  const on = (view.checked?.at === view.checks && view.checked.erasure_lines) || [];
  byId("erasures").replaceChildren(...sheet.erasures.map((e, i) => erasureRow(e, i, on)));
  byId("planned-fields").hidden = !sh.erasure;
  byId("planned-kind").textContent = sh.erasure ? `The planned erasure took away ${KINDS[sh.erasure.erased]}.` : "";
}

// numbered fills a select with the lines of the form, keeping its choice where the line is still
// there.
function numbered(select, fallback) {
  const kept = Number(select.value);
  select.replaceChildren(...view.lines.map((_, i) => option(String(i + 1), `${unit()} ${i + 1}`)));
  select.value = String(kept >= 1 && kept <= view.lines.length ? kept : Math.min(Math.max(fallback, 1), view.lines.length));
}

// showLines lays the lines of the form over the sheet and into the form.
function showLines() {
  byId("lines").replaceChildren(...view.lines.map(lineRow));
  numbered(byId("first-error"), current().expected.first_error ?? 1);
  numbered(byId("planned-line"), current().erasure?.line ?? 1);
  showErasures();
  showPicked();
  overlay();
}

// showMarkup fills the form in from the board's proposal and the plan.
function showMarkup() {
  const p = view.proposal;
  const sh = current();
  Object.assign(view, { lines: p.lines.map((l, i) => ({ ...fromPlan([...l.strokes], i), text: l.text, answer: l.answer })),
                        loose: [], picked: new Set(), drag: null, planned: p.planned ?? -1, checked: null, regrouped: false });
  byId("outcome").value = p.expected.outcome;
  byId("first-error").value = String(p.expected.first_error ?? 1);
  byId("trap").replaceChildren(option("", "none"), ...sh.traps.map((t) => option(t.id, `${t.id} — ${t.description}`)));
  byId("trap").value = p.expected.trap;
  byId("planned-line").value = String(sh.erasure?.line ?? 1);
  byId("planned-text").value = sh.erasure?.text ?? "";
  for (const id of ["outcome", "first-error", "trap", "planned-line"]) byId(id).onchange = () => edited();
  byId("planned-text").oninput = () => edited(true);
  byId("edit-note").textContent = "";
  showLines();
  byId("markup").hidden = false;
  edited();
}

// pick takes the stroke still on the sheet nearest to the click at p, within reach, into the picked
// strokes, or out of them.
function pick(p) {
  let best = null;
  let nearest = PICK;
  for (const st of visible()) {
    const d = Math.min(...st.points.map((a, i) => gap(p, a, st.points[i + 1] ?? a)));
    if (d <= nearest) {
      best = st;
      nearest = d;
    }
  }
  if (!best) return;
  if (view.picked.has(best.id)) view.picked.delete(best.id);
  else view.picked.add(best.id);
  showPicked();
  overlay();
}

// pickInside takes every stroke still on the sheet whose box lies wholly inside the rectangle from a
// to b into the picked strokes.
function pickInside(a, b) {
  const left = Math.min(a.x, b.x), right = Math.max(a.x, b.x), top = Math.min(a.y, b.y), bottom = Math.max(a.y, b.y);
  for (const st of visible()) {
    const box = boxOf(st);
    if (box.left >= left && box.right <= right && box.top >= top && box.bottom <= bottom) view.picked.add(st.id);
  }
  showPicked();
  overlay();
}

// The pointer picks after Done: a press and a release in place is a click, and a press dragged
// further than DRAG draws a rectangle that picks what lies inside it on release.
function dragTo(e) {
  const d = view.drag;
  if (!d || e.pointerId !== d.pointer) return false;
  const p = spot(e, surface());
  if (!d.to && Math.hypot(p.x - d.from.x, p.y - d.from.y) <= DRAG) return true;
  d.to = p;
  overlay();
  return true;
}

function dragEnd(e, lifted) {
  const d = view.drag;
  if (!d || e.pointerId !== d.pointer) return false;
  view.drag = null;
  if (!lifted) overlay();
  else if (d.to) pickInside(d.from, d.to);
  else pick(d.from);
  return true;
}

function showPicked() {
  const n = view.picked.size;
  byId("picked").textContent = n === 0
    ? `To change the ${unit()}s, click a stroke on the sheet to pick it, or drag a rectangle around strokes to pick them all.`
    : `${n === 1 ? "1 stroke" : n + " strokes"} picked.`;
  const to = byId("move-to");
  const keep = to.value;
  const targets = [...view.lines.map((_, i) => option(String(i), `${unit()} ${i + 1}`)), option("new", `a new ${unit()}`)];
  to.replaceChildren(...targets);
  to.value = targets.some((o) => o.value === keep) ? keep : targets[0].value;
  const loose = view.loose.length;
  byId("loose-note").textContent = loose ? `Not a ${unit()}: ${loose === 1 ? "1 stroke" : loose + " strokes"}, dashed on the sheet.` : "";
  setControls();
}

// regroup puts the lines of the form in order after a change of their strokes: a line left without
// strokes goes, the rest go top to bottom, each with its strokes in the order written; parts go in
// the order of first writing, by their earliest stroke. A line the change touched takes the plan's
// text at its new place; the others keep the text and the marks the author set on them, and the
// answer stays where the author put it if that line was not touched.
function regroup() {
  const order = new Map(sheet.strokes.map((s, i) => [s.id, i]));
  const kept = view.lines
    .filter((l) => l.strokes.length > 0)
    .map((l) => {
      const strokes = [...l.strokes].sort((a, b) => order.get(a) - order.get(b));
      return { line: l, strokes, at: ofParts() ? order.get(strokes[0]) : bandOf(l.strokes).top };
    })
    .sort((a, b) => a.at - b.at);
  const ownAnswer = kept.some((k) => !k.line.touched && k.line.answerSet);
  view.lines = kept.map(({ line, strokes }, i) => {
    const fresh = fromPlan(strokes, i);
    if (ownAnswer) Object.assign(fresh, { answer: !line.touched && line.answerSet, answerSet: !line.touched && line.answerSet });
    if (line.touched) return fresh;
    return { ...fresh, text: line.textSet ? line.text : fresh.text, textSet: line.textSet, illegible: line.illegible, crossed_out: line.crossed_out };
  });
  view.picked.clear();
  view.regrouped = true;
  byId("edit-note").textContent = `The ${unit()}s changed: a ${unit()} the change touched takes the plan’s text at its place, and the others keep what you set on them.`;
  showLines();
  edited();
}

// moveTo moves the picked strokes to a line of the form, by its index, to a new line, or out of the
// lines: "not a line", such as a drawing on a sheet of lines, or a stray stroke.
function moveTo(target) {
  const ids = [...view.picked];
  if (ids.length === 0) return;
  for (const l of view.lines) {
    const left = l.strokes.filter((id) => !view.picked.has(id));
    if (left.length !== l.strokes.length) Object.assign(l, { strokes: left, touched: true });
  }
  view.loose = view.loose.filter((id) => !view.picked.has(id));
  if (target === "loose") view.loose.push(...ids);
  else if (target === "new") view.lines.push({ strokes: ids, touched: true });
  else Object.assign(view.lines[Number(target)], { strokes: [...view.lines[Number(target)].strokes, ...ids], touched: true });
  regroup();
}

function joinNext(i) {
  Object.assign(view.lines[i], { strokes: [...view.lines[i].strokes, ...view.lines[i + 1].strokes], touched: true });
  view.lines[i + 1].strokes = [];
  regroup();
}

byId("move").addEventListener("click", () => moveTo(byId("move-to").value));
byId("loose").addEventListener("click", () => moveTo("loose"));
byId("unpick").addEventListener("click", () => {
  view.picked.clear();
  showPicked();
  overlay();
});

function answerLine() { return view.lines.findIndex((l) => l.answer) + 1; }

function sameCount() { return view.lines.length === current().lines.length; }

// erasureProblem says, in words, what keeps the planned erasure of the sheet from the save, or
// nothing: a sheet whose scenario plans an erasure has one, and its markup says what it took away.
function erasureProblem() {
  const sh = current();
  if (!sh.erasure) return "";
  if (!sheet.erasures.some((e) => !e.undo)) {
    return `The sheet has no move of the eraser, and the scenario ${sh.scenario} plans an erasure: Undo makes slips only, so write the sheet again, erasing in one move of the eraser.`;
  }
  if (view.planned < 0) return `Pick the planned erasure: the scenario ${sh.scenario} has one, and the rest are slips.`;
  if (byId("planned-text").value.trim() === "") return "Say what the erased strokes said.";
  return "";
}

// ready says whether the form holds markup the board can save: the plan's count of lines, the
// planned erasure picked where the scenario has one, and the board's last check of this very
// markup without a problem.
function ready() {
  if (!view.proposal || view.mode !== "markup" || !sameCount() || erasureProblem() !== "") return false;
  return view.checked?.at === view.checks && view.checked.problems.length === 0;
}

// edited follows every change of the form: the board's last check is of other markup now, so the
// page waits for a new one, after a pause in typing for a text.
function edited(typing = false) {
  view.checks += 1;
  clearTimeout(view.typing);
  clearFlags();
  refresh();
  if (typing) view.typing = setTimeout(checkNow, TYPE_MS);
  else checkNow();
}

function listInto(id, texts) { byId(id).replaceChildren(...texts.map((t) => make("li", t))); }

// sentence makes a note of the server a sentence of its own.
function sentence(text) { return text.charAt(0).toUpperCase() + text.slice(1) + "."; }

// fieldName names the field of the form a path of the request stands for, or gives the path.
function fieldName(path) {
  const line = /^sample\.lines\[(\d+)\]/.exec(path);
  if (line) return `${Unit()} ${Number(line[1]) + 1}`;
  if (/^sample\.erasures\[\d+\]\.planned/.test(path)) return "The planned erasure";
  const named = { "sample.lines": `The ${unit()}s`, "sample.erasures": "The erasures", "sample.expected.outcome": "The outcome",
    "sample.expected.first_error": `The first wrong ${unit()}`, "sample.expected.trap": "The trap" }[path];
  return named ?? path;
}

function described(notes) { return notes.map((d) => `${fieldName(d.path)}: ${d.message}.`); }

// refresh shows what the page knows of the markup at once; the board's check follows.
function refresh() {
  if (!view.proposal) return;
  const error = byId("outcome").value === "error";
  byId("first-error").disabled = !error;
  byId("trap").disabled = !error;
  // The board's notes on the lines hold until the lines change; then the page counts them itself.
  const notes = view.proposal.differences
    .filter((d) => d.path !== "sample.lines" || !view.regrouped)
    .map((d) => sentence(d.message) + (d.path === "sample.lines" ? mendHint() : ""));
  if (!sameCount() && view.regrouped) notes.unshift(`The sheet has ${view.lines.length} ${unit()}s, and its plan sheet ${current().lines.length}.${mendHint()}`);
  // The page names a count of lines off the plan's itself, so the board's count of them goes.
  const off = view.checked?.at === view.checks
    ? view.checked.differences.filter((d) => sameCount() || !(d.path === "sample.lines" && d.message.startsWith("are ")))
    : [];
  if (off.length) notes.push("Differs from the plan:", ...described(off));
  listInto("differences", notes);
  if (!sameCount()) say(`The ${unit()}s are not the plan’s, so the sheet cannot be saved.`);
  else if (erasureProblem()) say(erasureProblem());
  else if (view.checked?.at !== view.checks) say("Checking the markup…");
  else if (view.checked.problems.length) say("The markup does not pass the check: see the notes at the fields.");
  else say(`Check the ${unit()}s and the markup, then Save.`);
  setControls();
}

// checkNow asks the board to check the markup as it stands, the way a save would; an answer to an
// older markup is dropped.
async function checkNow() {
  const at = view.checks;
  const sh = current();
  let answer;
  try {
    answer = await post("/api/record/check", { number: sh.number, sample: sample() });
  } catch (err) {
    answer = { ok: false, data: { error: err.message } };
  }
  if (at !== view.checks || view.mode !== "markup") return;
  view.checked = answer.ok ? { at, ...answer.data } : { at, problems: [{ path: "check", message: answer.data.error || String(answer.status) }], differences: [], erasure_lines: [] };
  clearFlags();
  showProblems(view.checked.problems);
  showErasures();
  refresh();
}

// plannedMarkup is the markup of the erasure taken for the planned one, as the form has it.
function plannedMarkup() {
  return { line: Number(byId("planned-line").value), erased: current().erasure.erased, text: byId("planned-text").value.trim() };
}

// sample is the sheet as a document of the format tutor-sample v0: every field present, the
// erasures slips without markup but for the planned one, and the lines as the form has them.
function sample() {
  const sh = current();
  const outcome = byId("outcome").value;
  return {
    format: "tutor-sample", version: 0, sheet: { width: WIDTH, height: HEIGHT },
    task: sh.task, writer: "author", scenario: sh.scenario,
    strokes: sheet.strokes.map((s) => ({ id: s.id, points: s.points })),
    erasures: sheet.erasures.map((e, i) => ({ ...asErasure(e), planned: i === view.planned && sh.erasure ? plannedMarkup() : null })),
    lines: view.lines.map((l) => ({
      text: l.text.trim(), strokes: l.strokes, illegible: l.illegible, crossed_out: l.crossed_out, answer: l.answer,
    })),
    injection: null,
    expected: {
      outcome,
      first_error: outcome === "error" ? Number(byId("first-error").value) : null,
      trap: outcome === "error" ? byId("trap").value : "",
    },
  };
}

// flagFor is where the form shows a problem the board found at a path of the request, or null when
// no field of the form holds it.
function flagFor(path) {
  const line = /^sample\.lines\[(\d+)\]/.exec(path);
  if (line) return byId(`flag-line-${line[1]}`);
  const planned = /^sample\.erasures\[(\d+)\]\.planned\.(line|text)$/.exec(path);
  if (planned && Number(planned[1]) === view.planned) return byId(`flag-planned-${planned[2]}`);
  if (path === "sample.erasures" || path.startsWith("sample.erasures[")) return byId("flag-erasures");
  const field = { "sample.expected.outcome": "outcome", "sample.expected.first_error": "first-error", "sample.expected.trap": "trap" }[path];
  return field ? byId(`flag-${field}`) : null;
}

function clearFlags() {
  for (const id of ["outcome", "first-error", "trap", "erasures", "planned-line", "planned-text"]) byId(`flag-${id}`).textContent = "";
  for (let i = 0; i < (view.lines?.length ?? 0); i++) byId(`flag-line-${i}`).textContent = "";
  byId("problems").replaceChildren();
}

function showProblems(problems) {
  const rest = [];
  for (const p of problems) {
    const flag = flagFor(p.path);
    if (flag) flag.textContent = [flag.textContent, sentence(p.message)].filter(Boolean).join(" ");
    else rest.push(`${p.path}: ${p.message}`);
  }
  listInto("problems", rest);
}

byId("save").addEventListener("click", async () => {
  if (view.mode !== "markup" || view.busy || !ready()) return;
  const sh = current();
  const asked = sheet;
  clearFlags();
  view.busy = true;
  setControls();
  say("Saving…");
  let answer;
  try {
    answer = await post("/api/record/save", { number: sh.number, sample: sample() });
  } catch (err) {
    answer = { ok: false, data: { error: err.message } };
  }
  view.busy = false;
  if (sheet !== asked) return;
  if (answer.ok) {
    Object.assign(view, { mode: "saved", saved: true, picked: new Set() });
    sh.saved = answer.data.saved;
    byId("saves").textContent = savesText(sh.saved);
    const notes = described(answer.data.differences);
    listInto("differences", notes.length ? ["Saved with these differences from the plan:", ...notes] : []);
    say(`Saved as ${answer.data.file}. Go on with →, or Clear to write this sheet again.`);
    overlay();
    setControls();
    return;
  }
  showProblems(answer.data.problems ?? []);
  say(`The sheet is not saved: ${answer.data.error || answer.status}.`);
  setControls();
});

// A sheet written and not saved is lost with the tab, so the browser asks before it goes.
window.addEventListener("beforeunload", (e) => {
  if (unsaved()) e.preventDefault();
});

setControls();
(async () => {
  try {
    const res = await fetch("/api/record/plan");
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    view.plan = data;
    open(performance.now());
  } catch (err) {
    say(`The plan did not load: ${err.message}`);
    setControls();
  }
})();
</script>
</body>
</html>
