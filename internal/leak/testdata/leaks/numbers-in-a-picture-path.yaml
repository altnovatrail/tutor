# The path of a picture of an instance is searched as any text is (section 20): its numbers stand
# between - and - or ., so pictures/split-12-3.png holds the numbers 12 and 3, and a name that runs
# into a number, as rows12, holds none.
task:
  id: twelve-in-three-rows
  statement:
    - text: Twelve apples lie in equal rows. How many rows are there, if each row has four?
  canvas:
    kind: handwriting_sheet
  items:
    - answer_slots:
        - binding: anywhere
          check: {kind: number, key: "3"}
  solution:
    - text: "12 ÷ 4 = 3: there are 3 rows."
  skills:
    primary: [equal-sharing]
  band: grade-3
  difficulty: 1
texts:
  - text: "pictures/split-12-3.png"
    leaks: ["3"]
  - text: "pictures/apples-in-3-rows.png"
    leaks: ["3"]
  - text: "pictures/rows12-and-rows3.png"
    leaks: []
  - text: "pictures/apples-12.png"
    leaks: []
