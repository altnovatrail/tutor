# A sign written by hand that the statement names, as it SHOULD, is not searched for.
task:
  id: compare
  statement:
    - text: Write the sign <, > or = between the two numbers.
  canvas:
    kind: workbook
  items:
    - line:
        - text: "56"
        - binding: box
          check: {kind: choice, options: ["<", ">", "="], key: "<"}
        - text: "65"
  solution:
    - text: "56 has 5 tens and 65 has 6, so 56 < 65."
  skills:
    primary: [numbers-to-1000]
  band: grade-3
  difficulty: 1
texts:
  - text: "56 < 65"
    leaks: []
  - text: "<"
    leaks: []
