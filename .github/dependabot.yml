version: 2

updates:
  # The actions of the workflows, and the references to .github's shared workflows with them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # The Go modules the code is built from. Go itself, in the Dockerfile, and the tools the recipes
  # run by `go run` at an exact version are not among them: those are raised by hand. Neither is
  # .devcontainer/gopls/, the lock file of gopls: it is raised together with GOPLS_VERSION in the
  # Dockerfile (R12 in docs/decisions.md).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # spec's Go module moves together with the spec submodule, to its tag, in a task of its own (Д46
    # in spec's RUN.md; R64 in docs/decisions.md), so Dependabot does not raise it.
    ignore:
      - dependency-name: github.com/altnovatrail/spec
