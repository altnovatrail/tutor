# CodeQL over the repository's workflows and its languages (R09 .github), pinned to a release of
# .github. The job gives the shared workflow what it needs to upload its results.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: altnovatrail/.github/.github/workflows/codeql.yml@93c848fb51a10a245968cf730b99cc709a7748bf # v0.1.31
    # Go is read from a build, with the Go the Go checks run with: go.dev's archive that ARG
    # GO_VERSION and GO_SHA256_AMD64 of the toolchain stage of .devcontainer/Dockerfile pin, checked by
    # that sum, without building the stage (R09 .github, amended for Go; R16, R45 .github; R120).
    with:
      languages: go
