# CodeQL over the repository's workflows and its languages (R09 .github), pinned to a release of
# .github. The job gives the shared workflow what it needs to upload its results.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: altnovatrail/.github/.github/workflows/codeql.yml@f3addb7403d084c560c61481e217b93f8e7ee1f3 # v0.1.10
    # Go is read from a build, with the Go the Go checks run with: the toolchain stage of
    # .devcontainer/Dockerfile (R09 .github, amended for Go; R16 .github).
    with:
      languages: go
