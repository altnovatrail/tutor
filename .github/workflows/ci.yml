# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@fab102d8bbb4659575e107ee488e072aaaa71821 # v0.1.24

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@fab102d8bbb4659575e107ee488e072aaaa71821 # v0.1.24

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@fab102d8bbb4659575e107ee488e072aaaa71821 # v0.1.24

  # The repository's Go code, by its own ci- recipes in its toolchain stage, and the coverage of
  # its tests, which the shared workflow sends to Codecov (R16 .github; R66). id-token: write is for
  # its coverage job alone, which asks for an OIDC token: a called workflow can only lower what this
  # job gives it.
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/go.yml@fab102d8bbb4659575e107ee488e072aaaa71821 # v0.1.24

  # The samples of spec's eval protocol that tutor-eval draw writes, one of each kind it draws, as
  # internal/evalsample's testdata holds them, checked by spec's recipe sample-check against the
  # contracts of the spec submodule (R69; section 11 of spec's text of the contracts). go.yml checks
  # out no submodule, so this job is the repository's own, as the shared documents.yml runs its
  # check: in the toolchain stage of .devcontainer/Dockerfile, with its buf, Node and just.
  samples:
    name: Samples
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # The toolchain stage from the cache of GitHub Actions, by the steps of the shared go.yml of
      # the release above (R36 .github; the 2026-11-09 amendment to R31 spec; R117): the same file,
      # path and key, so the entry is the one go.yml's jobs fill and read, and the image is built
      # from the Dockerfile, which copies nothing from the repository, only on a miss.
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        run: |
          tar=$RUNNER_TEMP/toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from the cache."
                  exit 0
              fi
              echo "::warning::The cache's file of the toolchain stage does not load as the image toolchain: the image is built from the Dockerfile, on every run until the entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag toolchain - < .devcontainer/Dockerfile
          # A file the cache gave has its entry already, which no save replaces.
          if [ "$restored" = false ] && ! docker save --output "$tar" toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved for the cache: the next run builds it again."
              rm -f -- "$tar"
          fi

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: sample-check
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain just ci-sample-check

  # canvas's synthetic samples, from the release of canvas the justfile pins by its tag and the
  # SHA-256 of its archive: tutor's runner must read each, on the stub, with no key and no cost, and
  # fail on a spoiled one (R38 spec; R76). The recipe takes the banks at the tags of tutor the
  # samples name, by git archive, so the checkout fetches the tags; it needs the spec submodule for
  # sample-check, and the network for the archive.
  canvas:
    name: Canvas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      # The toolchain stage from the cache of GitHub Actions, by the steps of the shared go.yml of
      # the release above (R36 .github; the 2026-11-09 amendment to R31 spec; R117): the same file,
      # path and key, so the entry is the one go.yml's jobs fill and read, and the image is built
      # from the Dockerfile, which copies nothing from the repository, only on a miss.
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        run: |
          tar=$RUNNER_TEMP/toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from the cache."
                  exit 0
              fi
              echo "::warning::The cache's file of the toolchain stage does not load as the image toolchain: the image is built from the Dockerfile, on every run until the entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag toolchain - < .devcontainer/Dockerfile
          # A file the cache gave has its entry already, which no save replaces.
          if [ "$restored" = false ] && ! docker save --output "$tar" toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved for the cache: the next run builds it again."
              rm -f -- "$tar"
          fi

      - name: Toolchain image into the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: canvas-check
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain just ci-canvas-check
