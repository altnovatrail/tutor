# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@8311cbfc01082e9b196c0af8d7b49192115cc84c # v0.1.30

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@8311cbfc01082e9b196c0af8d7b49192115cc84c # v0.1.30

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@8311cbfc01082e9b196c0af8d7b49192115cc84c # v0.1.30

  # The repository's Go code, by its own ci- recipes in its toolchain stage, and the coverage of
  # its tests, which the shared workflow sends to Codecov (R16 .github; R66). id-token: write is for
  # its coverage job alone, which asks for an OIDC token: a called workflow can only lower what this
  # job gives it.
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/go.yml@8311cbfc01082e9b196c0af8d7b49192115cc84c # v0.1.30

  # The samples of spec's eval protocol that tutor-eval draw writes, one of each kind it draws, as
  # internal/evalsample's testdata holds them, checked by spec's recipe sample-check against the
  # contracts of the spec submodule (R69; section 11 of spec's text of the contracts). go.yml checks
  # out no submodule, so this job is the repository's own, as the shared documents.yml runs its
  # check: in the toolchain stage of .devcontainer/Dockerfile, with its buf, Node and just. It runs
  # no Go, so it takes no Go caches.
  samples:
    name: Samples
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # The image of the toolchain stage, from the cache of GitHub Actions, by the steps of the
      # shared go.yml of the release above (R36, R42 .github; the 2026-11-09 amendment to R31 spec;
      # R120): the same file, image, path and key, so the entry is the one go.yml's job toolchain
      # and documents.yml save on a push to main. On a miss the job builds the image itself: the
      # artifact of go.yml's job toolchain no job of this file can take. It saves nothing.
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        env:
          SAVE: "false"
        run: |
          tar=$RUNNER_TEMP/novatrail-toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect novatrail-toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from its file."
                  exit 0
              fi
              echo "::warning::The file of the toolchain stage does not load as the image novatrail-toolchain: the image is built from the Dockerfile. A file from the cache does so on every run until its entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag novatrail-toolchain - < .devcontainer/Dockerfile
          # Only a job that saves writes the file. A file that came has its entry or its artifact
          # already, which no save replaces.
          if [ "$SAVE" = true ] && [ "$restored" = false ] && ! docker save --output "$tar" novatrail-toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved: the jobs after this one and the next run build it again."
              rm -f -- "$tar"
          fi

      - name: sample-check
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              novatrail-toolchain just ci-sample-check

  # canvas's synthetic samples, from the release of canvas the justfile pins by its tag and the
  # SHA-256 of its archive: tutor's runner must read each, on the stub, with no key and no cost, and
  # fail on a spoiled one (R38 spec; R76). The recipe takes the banks at the tags of tutor the
  # samples name, by git archive, so the checkout fetches the tags; it needs the spec submodule for
  # sample-check, and the network for the archive.
  canvas:
    name: Canvas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      # The image of the toolchain stage, as in the job samples above: the steps of the shared
      # go.yml, the entry its job toolchain saves, a build of its own on a miss, no save (R120).
      - name: Toolchain image from the cache
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Toolchain image
        env:
          SAVE: "false"
        run: |
          tar=$RUNNER_TEMP/novatrail-toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect novatrail-toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "Toolchain image: loaded from its file."
                  exit 0
              fi
              echo "::warning::The file of the toolchain stage does not load as the image novatrail-toolchain: the image is built from the Dockerfile. A file from the cache does so on every run until its entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag novatrail-toolchain - < .devcontainer/Dockerfile
          # Only a job that saves writes the file. A file that came has its entry or its artifact
          # already, which no save replaces.
          if [ "$SAVE" = true ] && [ "$restored" = false ] && ! docker save --output "$tar" novatrail-toolchain; then
              echo "::warning::The image of the toolchain stage could not be saved: the jobs after this one and the next run build it again."
              rm -f -- "$tar"
          fi

      # The caches of Go — GOMODCACHE, GOCACHE and GOLANGCI_LINT_CACHE in one folder mounted at
      # /go-cache — by the steps of a job of the shared go.yml of the release above (R41 .github;
      # R120), with the check canvas in the key: go run ./cmd/tutor-eval builds the runner without
      # the race detector and the coverage of Go / test, so the entry is the job's own. Only a push
      # to main saves it, and a pull request reads main's.
      - name: Go caches from the cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-cache
          key: go-${{ runner.os }}-${{ runner.arch }}-canvas-${{ hashFiles('.devcontainer/Dockerfile') }}-${{ hashFiles('**/go.sum') }}

      # As in go.yml: what the cache gave is checked by go mod verify in every module of the
      # repository, and a check that fails costs the run its caches, not its verdict; verified
      # caches have their builds touched, so that go does not delete them by their age (R41 .github).
      - name: Go caches
        env:
          RESTORED: ${{ steps.go-cache.outputs.cache-matched-key }}
        run: |
          cache=$RUNNER_TEMP/go-cache
          mkdir -p -- "$cache/mod" "$cache/build" "$cache/lint"
          if [ -z "$RESTORED" ]; then
              echo "Go caches: none in the cache; the job starts with empty ones."
              exit 0
          fi
          verified=false
          if git ls-files -z -- ':(glob)**/go.mod' ':(exclude,glob)**/testdata/**' ':(exclude,glob)**/vendor/**' \
              ':(exclude,glob)**/.*/**' ':(exclude,glob)**/_*/**' > "$RUNNER_TEMP/go-modules"; then
              modules=()
              while IFS= read -r -d '' file; do
                  modules+=("$(dirname -- "$file")")
              done < "$RUNNER_TEMP/go-modules"
              if [ "${#modules[@]}" = 0 ]; then
                  echo "Go caches: ${RESTORED}, with no module of the repository to verify them by."
                  verified=true
              elif docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
                  --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
                  --volume "$PWD:/work" --volume "$cache:/go-cache" --workdir /work \
                  novatrail-toolchain bash -c 'for module in "$@"; do go -C "$module" mod verify || exit; done' bash "${modules[@]}"; then
                  echo "Go caches: ${RESTORED}, its modules verified."
                  verified=true
              fi
          fi
          if [ "$verified" = true ]; then
              find "$cache/build" "$cache/lint" -type f -exec touch -c -- {} +
              exit 0
          fi
          echo "::warning::The Go caches of ${RESTORED} did not pass go mod verify: they are deleted, and the job downloads and builds without them. An entry that fails on every run stays until it is deleted (gh cache delete) or go.sum or the Dockerfile changes."
          chmod -R u+w -- "$cache"
          rm -rf -- "$cache"
          mkdir -p -- "$cache/mod" "$cache/build" "$cache/lint"

      - name: canvas-check
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env GOMODCACHE=/go-cache/mod --env GOCACHE=/go-cache/build --env GOLANGCI_LINT_CACHE=/go-cache/lint \
              --volume "$PWD:/work" --volume "$RUNNER_TEMP/go-cache:/go-cache" --workdir /work \
              novatrail-toolchain just ci-canvas-check

      # As in go.yml: a push to main saves the caches once the check has passed, under a key no
      # entry holds yet; a pull request and every other event only read (R41 .github).
      - name: Go caches into the cache
        if: steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-cache
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
